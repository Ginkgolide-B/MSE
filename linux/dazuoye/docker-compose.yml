services:
  # ========== PostgreSQL 数据库 ==========
  db:
    image: postgres:15-alpine
    container_name: wtcg-db
    environment:
      POSTGRES_DB: war_thunder_card_game
      POSTGRES_USER: wtcg_user
      POSTGRES_PASSWORD: wtcg_pass_2024
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wtcg_user -d war_thunder_card_game"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ========== FastAPI 后端服务 ==========
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wtcg-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "postgresql+asyncpg://wtcg_user:wtcg_pass_2024@db:5432/war_thunder_card_game"
      SECRET_KEY: "war-thunder-card-game-secret-key-2024"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python /app/init_db.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  # ========== Nginx 前端静态服务 ==========
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wtcg-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata: